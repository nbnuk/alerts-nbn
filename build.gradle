plugins {
    id "groovy" 
    id "org.grails.grails-web" 
    id "org.grails.grails-gsp" 
    id "com.github.erdi.webdriver-binaries" version "3.0"
    id "war" 
    id "idea" 
    id "com.bertramlabs.asset-pipeline" 
    id "application" 
    id "eclipse"
    id "maven-publish"
}

version "5.2.5-NBN-0-0-0-SNAPSHOT"
group = "uk.org.nbn"

publishing {
    repositories {
        maven {
            name 'Nexus'
            url "https://repository.gbif.org/repository/${project.version.endsWith('-SNAPSHOT') ? 'uk-nbn-snapshots' : 'uk-nbn-releases'}"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {
            artifact war
        }
    }
}
repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    maven { url "https://repo.grails.org/grails/core/" }
    maven { url "https://repository.gbif.org/repository/uk-nbn-releases/" }
    maven { url "https://repository.gbif.org/repository/uk-nbn-snapshots/" }

}

configurations {
    all {
        resolutionStrategy.force 'org.codehaus.groovy:groovy-xml:3.0.13'
        resolutionStrategy.eachDependency { DependencyResolveDetails details->
            if (details.requested.group == 'org.seleniumhq.selenium') {
                details.useVersion('4.10.0')
            }
        }
    }
}

boolean inplace = false

dependencies {
    def noCache = {
        exclude group: 'org.grails.plugins', module: 'cache'
        exclude group: 'org.ehcache', module: 'ehcache'
    }
    implementation("org.grails:grails-core")
    implementation("org.grails:grails-logging")
    implementation("org.grails:grails-plugin-databinding")
    implementation("org.grails:grails-plugin-i18n")
    implementation("org.grails:grails-plugin-interceptors")
    implementation("org.grails:grails-plugin-rest")
    implementation("org.grails:grails-plugin-services")
    implementation("org.grails:grails-plugin-url-mappings")
    implementation("org.grails:grails-web-boot")
    implementation("org.grails.plugins:gsp")
    implementation("org.grails.plugins:hibernate5")
    implementation("org.grails.plugins:scaffolding")
    implementation("org.hibernate:hibernate-core:5.6.15.Final")
    implementation("org.springframework.boot:spring-boot-autoconfigure")
    implementation("org.springframework.boot:spring-boot-starter")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-logging")
    implementation("org.springframework.boot:spring-boot-starter-tomcat")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation 'org.grails.plugins:mail:4.0.0'
    implementation 'org.grails.plugins:cache'
    implementation "org.apache.httpcomponents:httpcore:4.4.16"
//    implementation "org.grails.plugins:cache-ehcache"
    if(!inplace) {
        implementation "au.org.ala:alerts:5.2.5-nbn-PLUGIN-0.0.0-SNAPSHOT"
    }
    else{
        implementation project(':alerts')
    }
    implementation "org.grails.plugins:ala-bootstrap5:1.0.0-SNAPSHOT", noCache
    implementation "org.grails.plugins:ala-auth:$alaSecurityLibsVersion"
    implementation "org.grails.plugins:ala-ws-security-plugin:$alaSecurityLibsVersion"
    implementation "org.grails.plugins:ala-ws-plugin:$alaSecurityLibsVersion"
    implementation "au.org.ala:userdetails-service-client:$alaSecurityLibsVersion"
    implementation "org.grails.plugins:ala-admin-plugin:2.4.0-SNAPSHOT"
    compileOnly("io.micronaut:micronaut-inject-groovy")
    console("org.grails:grails-console")
    runtimeOnly("com.bertramlabs.plugins:asset-pipeline-grails:4.3.0")
    runtimeOnly("com.h2database:h2")
    runtimeOnly("javax.xml.bind:jaxb-api:2.3.1")
    runtimeOnly("org.apache.tomcat:tomcat-jdbc")
    runtimeOnly("org.fusesource.jansi:jansi:1.18")
    runtimeOnly("org.glassfish.web:el-impl:2.2.1-b05")
    testImplementation "org.apache.httpcomponents:httpcore:4.4.16"
    testImplementation("io.micronaut:micronaut-inject-groovy")
    testImplementation("org.grails:grails-gorm-testing-support")
    testImplementation("org.grails:grails-web-testing-support")
    testImplementation("org.grails.plugins:geb")
    testImplementation("org.seleniumhq.selenium:selenium-api:4.10.0")
    testImplementation("org.seleniumhq.selenium:selenium-remote-driver:4.10.0")
    testImplementation("org.seleniumhq.selenium:selenium-support:4.10.0")
    testImplementation("org.spockframework:spock-core")
    testRuntimeOnly("org.seleniumhq.selenium:selenium-chrome-driver:4.10.0")
    testRuntimeOnly("org.seleniumhq.selenium:selenium-firefox-driver:4.10.0")
    testRuntimeOnly("org.seleniumhq.selenium:selenium-safari-driver:4.10.0")
    testImplementation("io.micronaut:micronaut-http-client")

}

application {
    mainClass.set("alerts.nbn.Application")
}

java {
    sourceCompatibility = JavaVersion.toVersion("17")
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperty "geb.env", System.getProperty('geb.env')
    systemProperty "geb.build.reportsDir", reporting.file("geb/integrationTest")
    systemProperty 'webdriver.chrome.driver', "${System.getenv('CHROMEWEBDRIVER')}/chromedriver"
    systemProperty 'webdriver.gecko.driver', "${System.getenv('GECKOWEBDRIVER')}/geckodriver"
}
tasks.withType(War).configureEach { War war ->
    war.dependsOn compileGroovyPages
}
//webdriverBinaries {
//    chromedriver '110.0.5481.77'
//    geckodriver '0.32.2'
//    edgedriver '110.0.1587.57'
//}
assets {
    minifyJs = true
    minifyCss = true
    minifyOptions = [
            excludes : [ '**/nbn.js' ]
    ]
}
